name: dotnet

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore WeatherDesk.sln
      - run: dotnet build WeatherDesk.sln --no-restore --configuration Release
      - run: dotnet test WeatherDesk.sln --no-build --no-restore --configuration Release
